[project]
name = "ember"
version = "0.1.0"
description = "A really simple long-term memory for an AI companion, served as a remote MCP server from your own computer."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["mcp>=1.12,<2"]

[project.scripts]
ember = "ember.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ember"]

[tool.pytest.ini_options]
testpaths = ["tests"]
